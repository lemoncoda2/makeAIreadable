general:
  base_model: ./models/Qwen3-4B
  num_cycles: 2
  project_root: .
  num_gpus: 4
grpo:
  config: configs/grpo_config.yaml
  num_tasks_collect: 2000
dpo:
  config: configs/dpo_config.yaml
  threshold: 6.0
  # Fail filter phase if fewer pairs kept (GOAL suggests ≥1500).
  min_pairs: 1500
inference:
  # false: HuggingFace+PEFT (supports LoRA adapter dirs) — recommended on V100.
  # true: pipeline merges LoRA → model_rl_merged via src/merge_lora.py before collect.
  use_vllm: false
eval:
  num_tasks_benchmark: 200
  num_tasks_readability: 50
  mbpp_plus: ./data/mbpp_plus_test.jsonl
  lcb_easy: ./data/lcb_easy.jsonl
