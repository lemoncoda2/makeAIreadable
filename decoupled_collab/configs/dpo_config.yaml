# DPO training config (GOAL Step 3.4)
# NOTE: pipeline CLI --model / --dpo_data / --output override these paths.
model:
  name_or_path: ./checkpoints/cycle_0/model_rl
  torch_dtype: float16

output_dir: ./checkpoints/cycle_0/model_rl_dpo

lora:
  rank: 32
  alpha: 64
  # Prefer CLI --model. If set here, it is used only when --model is omitted.
  # Do NOT hard-pin cycle_0 when running later cycles via the pipeline.
  resume_from: null

dpo:
  beta: 0.1
  loss_type: sigmoid
  label_smoothing: 0.0
  reference_free: false

training:
  learning_rate: 5.0e-6
  num_epochs: 3
  # batch 2 + full ref copy OOMs on V100; PEFT implicit ref + batch 1 is safer.
  per_device_batch_size: 1
  gradient_accumulation_steps: 8
  max_length: 1536
  max_prompt_length: 1024
  warmup_ratio: 0.1
  fp16: true

data:
  # Matches run_pipeline.py output name (not *_pairs.jsonl).
  train_file: ./data/dpo_pairs/cycle_0_filtered.jsonl
  eval_split: 0.05

logging:
  # wandb_project: decoupled-collab
  wandb_run: cycle0_dpo
